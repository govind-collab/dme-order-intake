services:
  - type: web
    name: dme-order-intake
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dme-order-intake-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://dme-order-intake-ui.onrender.com
      - key: DAILY_UPLOAD_LIMIT_PER_USER
        value: "100"
      - key: DAILY_UPLOAD_LIMIT_TOTAL
        value: "500"

  # A separate static site, so a frontend build can never break the API deploy
  - type: web
    name: dme-order-intake-ui
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://dme-order-intake.onrender.com
      - key: NODE_VERSION
        value: "24"

databases:
  - name: dme-order-intake-db
    plan: free
    ipAllowList: []
